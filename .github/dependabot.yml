# ORW-955: keep the dependency set current so security alerts do not pile up unseen.
# Weekly, minor/patch updates grouped into one PR per ecosystem, at most 5 open PRs each.
# Major bumps arrive as their own PRs (not grouped) so each gets a deliberate review.
# Note: deploy installs frontend/requirements.lock.txt (the pinned set); a Dependabot PR
# that touches only requirements.txt must be followed by a lock refresh.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
