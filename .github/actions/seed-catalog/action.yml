name: seed catalog
description: "ORW-1013: fetch the latest nightly seed catalog from main (fail-soft: none found means the old seed order) and point ORWELL_SEED_CATALOG at it"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow seed-catalog-nightly.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null)
        if [ -n "$id" ] && gh run download "$id" --repo "$GITHUB_REPOSITORY" -n seed-catalog -D "$RUNNER_TEMP/seed-catalog" >/dev/null 2>&1 && [ -s "$RUNNER_TEMP/seed-catalog/seed-catalog.json" ]; then
          echo "ORWELL_SEED_CATALOG=$RUNNER_TEMP/seed-catalog/seed-catalog.json" >> "$GITHUB_ENV"
          echo "seed catalog: run $id ($(node -e 'const j=require(process.argv[1]);console.log(Object.keys(j.scans||{}).length+" scans, main "+(j.commit||"?").slice(0,9))' "$RUNNER_TEMP/seed-catalog/seed-catalog.json"))"
        else
          echo "seed catalog: none found; the scans use their own hints and range"
        fi
        exit 0
