name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel the in-flight run for a ref the moment a newer commit arrives, so a
# superseded commit doesn't burn runner minutes finishing a run nobody is waiting
# on. Keyed per ref, so main and each PR have independent groups.
# Least-privilege default token: every job only checks out code and runs read-only
# tests (no pushes, PR comments, or releases). Artifact upload needs no repo write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: each merge was cancelling the previous run (19 of 39 in 24h), so main rarely finished a verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The gh-hosted runners intermittently can't reach the npm registry (ETIMEDOUT / ENETUNREACH on `npm ci`
# before any test runs — seen on #1911 smoke and #1912 mirror-parity). Retry the fetches with backoff
# instead of failing the whole job on one dropped connection.
#
# onnxruntime-node's postinstall on linux/x64 also pulls the CUDA 12 execution-provider binaries from
# api.nuget.org on every `npm ci`. Nothing here uses CUDA (the CPU runtime ships inside the package),
# and that nuget fetch is the intermittent install timeout seen on #1929. Skip it.
env:
  ONNXRUNTIME_NODE_INSTALL: "skip"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"

jobs:
  # ── Path filters ────────────────────────────────────────────────────────────
  #
  # One cheap job computes a set of boolean outputs from the PR/push diff; every other job gates its
  # `if:` on the relevant boolean. The point: a job runs ONLY when files it actually exercises change.
  #   - a docs-only PR (`docs/**` only) flips ALL of these false ⇒ every gated job skips ⇒ the PR
  #     goes green in seconds (the unified `ci-gate` reports the required status; see below).
  #     Exception: Gherkin `docs/features/*.feature` files are executable specs, so they count as engine.
  #   - a frontend-only PR runs only `frontend` (engine + heavy + smoke skip).
  #   - an engine PR runs `test`/`coverage`/`heavy-sims` (frontend skips); etc.
  #
  # The booleans:
  #   engine   — src/tests/features + the build/test config + this workflow → gates `test`, `coverage`.
  #   frontend — frontend/** + this workflow                                → gates `frontend`.
  #   deploy   — src/** + frontend/** + deploy/** + this workflow           → gates `smoke` (boots both).
  #   heavy    — the calibration-relevant inputs (a subset of engine)       → gates `heavy-sims`.
  #
  # CRITICAL: gated jobs that SKIP must not deadlock a required check. The single `ci-gate` job at the
  # bottom (`if: always()`) is the ONE required check — it passes when no needed job FAILED/was
  # CANCELLED (a SKIP counts as a pass). Point branch protection at `ci-gate`, not the individual jobs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
      heavy: ${{ steps.filter.outputs.heavy }}
      fe_render: ${{ steps.filter.outputs.fe_render }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
          # Need the base ref to diff against on a PR; on push, HEAD~1 is enough.
          fetch-depth: 0
      - name: detect changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # On a PR, diff the base..head; on push, diff against the previous commit.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Diffing against base: $base"
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          # Helper: does any changed file match the given ERE?
          matches() { echo "$changed" | grep -qE "$1"; }

          # ENGINE: TS sources, all tests, BDD step code (features/) AND the Gherkin itself — the .feature
          # files live under docs/features/, so a scenario-only edit must still run the BDD gate (BDD PAT-6),
          # the build/test config, this workflow. (Deliberately matches EVERY .feature, including spec-only ones
          # cucumber.cjs does not execute: cheap insurance, and a later wiring into cucumber.cjs can't slip through.)
          ENGINE_RE='^(src/|tests/|features/|docs/features/.*\.feature$|package\.json$|package-lock\.json$|tsconfig.*\.json$|vitest\.(config|shard\.config|sequencer)\.ts$|ci/|cucumber\.cjs$|\.github/workflows/ci\.yml$)'
          # FRONTEND: the vendored Python app + this workflow.
          FRONTEND_RE='^(frontend/|\.github/workflows/ci\.yml$)'
          # DEPLOY: anything the end-to-end deploy smoke boots — engine, FE, deploy scripts, this workflow.
          DEPLOY_RE='^(src/|frontend/|deploy/|\.github/workflows/ci\.yml$)'
          # HEAVY (calibration-relevant): the simulation inputs. A subset of engine — a docs/frontend
          # change can never move a calibration result, so the heavy lane skips for those. `deploy/orwell-env-defaults.sh` is in the set
          # because it still writes the gameplay flags to a box's .env (an `=0` there overrides the code default), so a change to it re-plays the game.
          HEAVY_RE='^(src/|tests/|package\.json$|package-lock\.json$|vitest\.config\.ts$|cucumber\.cjs$|deploy/orwell-env-defaults\.sh$|\.github/workflows/ci\.yml$)'
          # ORW-193 PRECISION (pull requests ONLY; a push to main always uses the broad sets above, so main never loses coverage):
          #   - `heavy`: the heavy sims import only src/ plus their own tests/{uat,property,calibration} files and the tests/support
          #     setup files, so an edit under tests/{unit,integration,architecture,dev} cannot move a calibration result.
          #   - `fe_render` / `deploy`: edits to ONLY front-end tests or markdown (frontend/tests/** except the vendored axe-core,
          #     frontend/**/*.md) cannot change what the render lanes (fe-browser, fe-responsive, mirror-parity, a11y-matrix) and the
          #     deploy smoke boot. The pytest lanes (fe-unit, fe-browser-tests) still run for any frontend/ change.
          fe_changed="$changed"
          if [ "${EVENT_NAME:-}" = "pull_request" ]; then
            HEAVY_RE='^(src/|tests/(uat|property|calibration|support)/|package\.json$|package-lock\.json$|vitest\.config\.ts$|cucumber\.cjs$|deploy/orwell-env-defaults\.sh$|\.github/workflows/ci\.yml$|\.github/actions/)'
            fe_changed="$(echo "$changed" | grep -vE '^frontend/(tests/|.*\.md$)' || true; echo "$changed" | grep -E '^frontend/tests/vendor/' || true)"
            DEPLOY_RE='^(src/|frontend/|deploy/|\.github/workflows/ci\.yml$|\.github/actions/)'
          fi
          FRONTEND_RE="$FRONTEND_RE|^\.github/actions/"
          for name in engine frontend fe_render deploy heavy; do
            subject="$changed"
            case "$name" in
              engine)    re="$ENGINE_RE" ;;
              frontend)  re="$FRONTEND_RE" ;;
              fe_render) re="$FRONTEND_RE"; subject="$fe_changed" ;;
              deploy)    re="$DEPLOY_RE"; subject="$fe_changed" ;;
              heavy)     re="$HEAVY_RE" ;;
            esac
            if echo "$subject" | grep -qE "$re"; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
              echo "==> ${name}: WILL run"
            else
              echo "${name}=false" >> "$GITHUB_OUTPUT"
              echo "==> ${name}: skipped"
            fi
          done

  # ── Engine gate ───────────────────────────────────────────────────────────────
  # typecheck -> build -> unit/property/arch (minus the heavy sims) -> BDD.
  #
  # The HEAVY end-to-end simulation files (the full-game UAT, the juryReach calibration gate, and the
  # calibration-gradient gate) are split into the parallel `heavy-sims` matrix below (`test:ci` runs
  # `test:unit:fast`, which excludes exactly those). Nothing is dropped — the heavy sims run, in
  # sibling jobs, concurrently — so this job returns in roughly the time of the rest of the suite
  # while the long pole shrinks toward the single slowest sharded leg. The dependency-cruiser
  # Vault-Wall arch test, the live sentinel sweeps, and the BDD gate all still run HERE.
  #
  # PATH-GATED (`changes.engine`): a docs-only / frontend-only PR skips it (the unified `ci-gate`
  # reports green for the skip).
  test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      # The BDD gate (test:bdd) includes the 0072/0073 scenarios whose step defs delegate to the
      # vendored front-end's pytest (the authoritative game-build-wall / gateway assertions, which
      # import the FE app). Those wrappers shell out to `python3 -m pytest`, so the engine test job
      # needs the FE deps too — without them the BDD gate fails with "No module named pytest".
      - run: pip install -r frontend/requirements.lock.txt
      # ORW-39: the unit suite runs in the sharded `test-unit` job below; this job keeps the typecheck, the build and the BDD gate (same checks, no unit tests here).
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:bdd

  # ── Unit suite, SHARDED (ORW-39) ────────────────────────────────────────────────
  # `test:unit:fast` (everything but the heavy sims) split four ways with vitest's own --shard; every file still runs exactly once across the legs.
  # The build runs first because some unit tests exercise dist/. `ci-gate` needs this job, so a failed leg fails the gate.
  test-unit:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r frontend/requirements.lock.txt
      - run: npm run build
      - run: npm run test:unit:fast -- --shard=${{ matrix.shard }}/4

  # ── Heavy simulation lane (ONE job — consolidated for the single self-hosted runner) ──────────
  #
  # Plays the full-game UAT, the juryReach calibration gate, and the calibration-gradient gate to
  # completion — the same files `test:ci` excludes — via `npm run test:heavy`, which runs all five
  # heavy files in ONE vitest process. Vitest fans them out across the runner's cores internally.
  #
  # Topology (ORW-193): a MATRIX of four legs, each running its group of `npm run test:heavy:<script>` scripts back to back
  # (UAT 12-seed in three shards + 5-seed + decisions + reweight; jury + jury-reweight; gradient + gradient-reweight). juryReach and calibrationGradient run
  # UNSHARDED inside their own leg and assert the full band inline (see each file's header). The code defaults are the
  # deployed profile, so this lane replaces the old flags-off `heavy-sims` AND the retired advisory `heavy-sims-deployed`.
  #
  # PATH-GATED (`changes.heavy`): runs only when calibration-relevant files change. On a skip it
  # doesn't run — `ci-gate` reports the required green status so a docs/frontend-only PR never deadlocks.
  heavy-sims:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # The code defaults ARE the deployed profile now (the 2026-11 default flip): the heavy lane plays what ships. `ORWELL_FLAGS_OFF=1` is the
    # diagnostic legacy profile and is NOT run here. UAT_TIMEOUT_SCALE widens the one UAT test whose per-test timeout actually fires (the
    # real-HTTP decisions test, which yields to the event loop).
    #
    # ORW-193: measured on 25 post-ORW-39 runs, each of the ten per-file legs ran 35-140 s of real work behind 20-30 s of runner start-up
    # and (under load) a 4-13 min queue for a slot, so ten slots were spent on about 15 minutes of work. The same ten npm scripts now run in
    # four balanced legs (about 2-4 min each). Every script still runs exactly once; a failing script does not hide the later ones in its leg.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: uat-12seed
            scripts: "uat-12seed-a uat-12seed-b uat-12seed-c"
          - leg: uat-rest
            scripts: "uat-5seed uat-decisions uat-reweight"
          - leg: jury
            scripts: "jury jury-reweight"
          - leg: gradient
            scripts: "gradient gradient-reweight"
    name: heavy-sims (${{ matrix.leg }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: heavy sims (${{ matrix.scripts }})
        env:
          UAT_TIMEOUT_SCALE: "10"
          SCRIPTS: ${{ matrix.scripts }}
        run: |
          rc=0
          for s in $SCRIPTS; do
            echo "::group::npm run test:heavy:$s"
            npm run "test:heavy:$s" || { echo "::error::heavy sim '$s' FAILED"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

  # ── Coverage gate ──────────────────────────────────────────────────────────────
  # Per-directory branch thresholds in vitest.config.ts — coverage can no longer silently regress
  # while the functional gate stays green. `test:cov` EXCLUDES the heavy simulation files (under v8
  # instrumentation they re-run the whole live loop a second, slower time yet add no BRANCH coverage in
  # the gated dirs the rest of the live-loop suite doesn't already cover). PATH-GATED (`changes.engine`).
  coverage:
    needs: [changes, coverage-shard]
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-blob-*
          path: .vitest-reports
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-manifest-*
          path: .shard-manifests
          merge-multiple: true
      - name: all four shard reports must be present
        run: |
          ls -l .vitest-reports
          test "$(ls .vitest-reports/blob-*.json | wc -l)" -eq 4
      # ORW-218: the duration-balanced split must have run every test file exactly once across the four legs (nothing unassigned, nothing twice, set == files on disk minus the heavy exclusions).
      - name: shard union equals the full test set
        run: >-
          node ci/check-shard-union.mjs .shard-manifests --count 4 --exclude 'tests/uat/**' --exclude 'tests/property/juryReach.property.test.ts' --exclude 'tests/property/juryReachAggregate.property.test.ts' --exclude 'tests/property/juryReachShowrunnerReweight.property.test.ts' --exclude 'tests/property/calibrationGradient.property.test.ts' --exclude 'tests/property/calibrationGradientAggregate.property.test.ts' --exclude 'tests/property/calibrationGradientShowrunnerReweight.property.test.ts' --exclude 'tests/calibration/**'
      # The ONLY place the per-directory branch floors (vitest.config.ts) are enforced: one merged measurement over all four shards.
      - run: >-
          npx vitest run --merge-reports --coverage.provider=v8 --coverage.include='src/**' --coverage.exclude='src/ports/**' --coverage.exclude='src/main.ts'
          --coverage

  # ── Coverage gate, SHARDED (ORW-39) ─────────────────────────────────────────────
  # Four legs each run a disjoint slice of the coverage suite under v8 and upload a blob (vitest.shard.config.ts zeroes the floors for the legs only);
  # the `coverage` job below merges the blobs and enforces the ORIGINAL thresholds once on the merged measurement.
  coverage-shard:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: coverage leg (duration-balanced slice; writes its file manifest for the union check in `coverage`)
        env:
          ORWELL_SHARD_MANIFEST_DIR: .shard-manifests
        run: >-
          npx vitest run --config vitest.shard.config.ts --coverage --coverage.provider=v8 --coverage.include='src/**' --coverage.exclude='src/ports/**' --coverage.exclude='src/main.ts'
          --exclude 'tests/uat/**' --exclude 'tests/property/juryReach.property.test.ts' --exclude 'tests/property/juryReachAggregate.property.test.ts' --exclude 'tests/property/juryReachShowrunnerReweight.property.test.ts' --exclude 'tests/property/calibrationGradient.property.test.ts' --exclude 'tests/property/calibrationGradientAggregate.property.test.ts' --exclude 'tests/property/calibrationGradientShowrunnerReweight.property.test.ts' --exclude 'tests/calibration/**'
          --coverage.reporter=json --shard=${{ matrix.shard }}/4 --reporter=blob --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest-reports/
          # the folder is hidden (leading dot): upload-artifact@v4 skips hidden files unless told otherwise ("Found 0 artifact(s)")
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # Kept out of .vitest-reports: `vitest --merge-reports` parses every file in that folder as a blob.
      - uses: actions/upload-artifact@v4
        with:
          name: shard-manifest-${{ matrix.shard }}
          path: .shard-manifests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ── Deploy smoke ────────────────────────────────────────────────────────────────
  # Build + start the engine, probe the HTTP MCP surface, boot the real front-end against a
  # token-enforcing engine, drive a full turn. PATH-GATED (`changes.deploy` — engine/FE/deploy scripts).
  smoke:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      # The end-to-end smoke stage (B71/ops A7) boots the REAL front-end against a
      # token-enforcing engine and drives a full turn — it needs the FE deps.
      - run: pip install -r frontend/requirements.lock.txt
      - name: deploy scripts parse
        # Enumerate EVERY tracked deploy shell script recursively (incl. nested dirs like
        # deploy/expose/*.sh) — the old non-recursive `deploy/*.sh` glob silently skipped them (#618).
        # The top-level + `**/` pathspecs together cover both the root and nested scripts (git's `**`
        # alone does not match zero intermediate dirs).
        run: for s in $(git ls-files 'deploy/*.sh' 'deploy/**/*.sh'); do bash -n "$s"; done
      - name: engine + system deploy smoke
        run: bash deploy/smoke.sh

  # ── Front-end gate (SPLIT 3 ways so it fans out across the runner pool) ──────────
  # The vendored Python app is outside the TS tooling. It used to be ONE ~7-min job (the CI long
  # pole). Split into pytest / browser-smoke / responsive-matrix so a multi-runner pool runs them
  # in PARALLEL. All three are PATH-GATED on `changes.frontend`; an engine-only PR skips them.
  # The Python pytest lane, split by the `browser` marker (auto-applied in frontend/tests/conftest.py to
  # every `sync_playwright` test). The ~3750 non-browser tests run PARALLEL under xdist here (~1.5 min vs
  # the old ~12.5-min serial run); the ~100 headless-Chromium tests run in their own serial lane below.
  # Shorter jobs are the whole point: a job that finishes in ~2 min survives a self-hosted-runner fleet
  # blip that would guillotine a 12-min one. `-n 4` (not `auto`) bounds worker memory to a fixed cost so a
  # bigger runner can't spawn N workers × the FastAPI app and OOM the box.
  # ORW-193: split in two by test FILE (ORWELL_CI_SHARD, frontend/tests/_ci_shard.py; every file runs in exactly one shard), each shard still
  # `-n 4`. The serial pytest step was 5.5 min of the ~6 min job. The py_compile and JS syntax checks are cheap and run in both shards.
  fe-unit:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: fe-unit (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: py_compile the front-end (incl. extensionless CLI scripts)
        run: |
          python3 -m py_compile $(git ls-files 'frontend/**/*.py')
          for s in $(git ls-files 'frontend/scripts/*' 'frontend/integrations/**'); do
            head -1 "$s" | grep -q python && python3 -m py_compile "$s" || true
          done
      - name: install front-end deps
        run: pip install -r frontend/requirements.lock.txt
      - name: pytest — non-browser suite, parallel (app-admin 0029, game build 0032)
        env:
          ORWELL_SKIP_GUARD: "1"   # A41: fail the lane if the skip count rises above frontend/tests/skip_ceiling.json
          ORWELL_SKIP_LANE: unit
          ORWELL_CI_SHARD: ${{ matrix.shard }}/2
        run: cd frontend && python3 -m pytest tests/ -m "not browser" -n 4 -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # EVERY front-end script, parsed as an ES module (they are loaded as modules). A comment containing
      # a literal `*/` in chatReconcile.js (#1785) broke the whole module at page load and blanked the send
      # path; the old two-file check could not see it. Copy to .mjs so node parses module syntax.
      - name: syntax-check all front-end JS (as ES modules)
        run: |
          tmp="$(mktemp -d)"; bad=0
          for f in $(git ls-files 'frontend/static/js/*.js'); do
            cp "$f" "$tmp/check.mjs"
            node --check "$tmp/check.mjs" 2>"$tmp/err" || { echo "::error file=$f::$(head -5 "$tmp/err" | tr '\n' ' ')"; bad=1; }
          done
          exit $bad

  # The headless-Chromium pytest tests (the `browser` marker). Serial WITHIN a job (they bind fixed ports / drive a
  # real page) with `--reruns 1` so the known environmental onboarding-scrim flake (#925/#1148/#930)
  # self-recovers within the job instead of reddening the whole run. Needs the chromium binary, installed
  # by the shared `setup-playwright` composite action (cache + bounded `--with-deps` + fallback).
  fe-browser-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ORW-193: three parallel shards by test file (ORWELL_CI_SHARD); the serial lane was 13 of ~15 min on every FE PR. Still serial WITHIN a
    # shard (fixed ports, one real page at a time) with the same `--reruns 1`. The A41 guard still demands 0 skips in every shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: fe-browser-tests (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install front-end deps
        run: pip install -r frontend/requirements.lock.txt
      - uses: ./.github/actions/setup-playwright
      # The real-stack browser tests (test_m0_3_midgen_join, test_p0h_day1_clock_e2e, test_b13_interrupt_e2e, test_first_message_double_render, test_f3_drop_after_saved_no_recovery, ...) boot the
      # BUILT engine (`dist/main.js`) and skipped with "engine bundle missing" because this job never built it. The A41 skip guard surfaced that 23 browser tests were silently not running.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build the engine bundle (dist/main.js) for the real-stack browser tests
        run: npm run build
      - name: pytest — headless-browser suite, serial + retry-once
        env:
          ORWELL_SKIP_GUARD: "1"   # A41: in this lane NO browser test may skip (a missing chromium must be red, not green)
          ORWELL_SKIP_LANE: browser
          ORWELL_CI_SHARD: ${{ matrix.shard }}/3
        run: cd frontend && python3 -m pytest tests/ -m browser --reruns 1 -q -rs --durations=8

  fe-browser:
    needs: changes
    if: needs.changes.outputs.fe_render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install front-end deps
        run: pip install -r frontend/requirements.lock.txt
      - uses: ./.github/actions/setup-playwright
      - name: boot smoke — real app, game-build gating (feature 0032)
        run: cd frontend && python3 scripts/boot_smoke.py
      - name: browser smoke — keep-set UI loads, no broken modules (feature 0032)
        run: cd frontend && python3 scripts/browser_smoke.py

  fe-responsive:
    needs: changes
    if: needs.changes.outputs.fe_render == 'true'
    runs-on: ubuntu-latest
    # 25 min: the engine-staged run adds npm ci + build (~2 min) and the ORWELL_MATRIX_FINISH
    # season fast-forward (~2 min of Echo-narrator advance calls) to the ~2-min sweep itself.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-hosted runner: don't leave the job GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install front-end deps
        run: pip install -r frontend/requirements.lock.txt
      - uses: ./.github/actions/setup-playwright
      # ── #651 gap 1: stage a REAL engine so the game surfaces are actually measured ──────────
      # Without ORWELL_MATRIX_ENGINE the gate runs CHROME-ONLY (no game staged), so the game
      # surfaces (#orwell-status, #orwell-presence, the decision card, #orwell-retro, …) were
      # NEVER measured for overflow/overlap/crowding/touch in CI — a whole class of UI
      # regressions shipped green. Boot the engine (deterministic Echo narrator, key-free —
      # same as deploy-smoke/mirror-parity) and run the matrix engine-staged, with
      # ORWELL_MATRIX_FINISH=1 so the endgame surfaces (retro, finale card) render too (J5-19).
      - name: build the engine (dist/main.js the matrix stages against)
        run: |
          npm ci
          npm run build
      - name: boot the engine
        run: |
          ORWELL_ENGINE_PORT=8765 ORWELL_DATA_DIR="$RUNNER_TEMP/orwell-matrix-data" \
            node dist/main.js > "$RUNNER_TEMP/orwell-matrix-engine.log" 2>&1 &
          for i in $(seq 60); do
            if curl -fsS http://127.0.0.1:8765/health > /dev/null 2>&1; then
              echo "engine healthy"; exit 0
            fi
            sleep 1
          done
          echo "::error::engine did not become healthy"
          cat "$RUNNER_TEMP/orwell-matrix-engine.log"
          exit 1
      - name: responsive matrix gate — viewports x surfaces, ENGINE-STAGED (Stream S, ruling 16; #651)
        env:
          ORWELL_MATRIX_ENGINE: http://127.0.0.1:8765
          ORWELL_MATRIX_FINISH: "1"
        run: cd frontend && python3 scripts/responsive_matrix.py
      - name: engine log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/orwell-matrix-engine.log" || true

  # ── F5 two-window live mirror-parity gate (ship-gate F5 / ADR 0012 §3.3 / ADR 0015) ──────────
  #
  # The executable, model-independent gate for the #1 release blocker — realtime two-window mirror
  # parity. `run_mirror_gate.sh` boots the REAL stack (engine + the deterministic streamed fake model +
  # the FE + a started game), opens two browser windows on the one canonical session, sends a turn from
  # window A, and asserts window B mirrors A's LIVE stream through the SAME incremental renderer
  # (`createStreamRenderer`) — not a settled-transcript diff. Key-free (deterministic narrator), like
  # boot/browser smoke. See docs/audits/playtest-harness/README.md §10 and docs/decisions/0015.
  #
  # PATH-GATED (`changes.frontend`): the render path being proven lives in frontend/static/js/. A
  # docs-only / engine-only PR skips it (the unified `ci-gate` reports green for the skip).
  #
  # DETERMINISTIC ON ANY HOST (PR #1276): the gate sends a WARM-UP turn so B is a pre-subscribed mirror
  # (no first-turn cold-start discovery cost), widens A's reply stream (FAKE_TOKEN_DELAY_MS) so B's live
  # attach lands mid-stream regardless of host speed, and waits for the observer to record the structural
  # evidence before draining (README §10 "Timing model"). The small retry below is now belt-and-suspenders
  # (a self-hosted-runner boot blip), not the mechanism the gate relies on to be green.
  mirror-parity:
    needs: changes
    if: needs.changes.outputs.fe_render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # one group of gate legs, each with bounded retries (was 40 for all six in one job)
    # ORW-193: the six gate legs ran back to back in ONE ~9.5 min job (the second-longest FE lane). Split into two parallel jobs of three-ish
    # legs each; the legs are independent (each boots its own engine + FE on its own ports) and every one still runs, with the same retries.
    #   live = the F5 live parity gate, SSE + WS (about 4.7 min)   rest = tool-turn + HUD parity, SSE + WS each (about 4.2 min)
    strategy:
      fail-fast: false
      matrix:
        group: [live, rest]
    name: mirror-parity (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: build the engine (dist/main.js the gate boots)
        run: |
          npm ci
          npm run build
      - name: front-end venv (the gate runs frontend/.venv/bin/python)
        run: |
          python3 -m venv frontend/.venv
          frontend/.venv/bin/pip install --upgrade pip
          frontend/.venv/bin/pip install -r frontend/requirements.lock.txt
      - name: mirror-parity gate — SSE/poll fallback transport (blocking)
        if: matrix.group == 'live'
        run: |
          set -uo pipefail
          # The blocking F5 gate runs in the SSE/poll FALLBACK transport (MIRROR_WS_TRANSPORT=0 ⇒
          # ORWELL_WS_TRANSPORT off for this leg). Since 2026-07-10 (#1357) WS-on is the production
          # default, so this leg proves the permanent fallback still passes F5. Pinned explicitly so the
          # WS leg below never changes what this required leg proves. `MIRROR_WS_TRANSPORT=0` is a
          # single-mode run of run_mirror_gate.sh.
          for attempt in 1 2 3 4; do
            echo "──── mirror-parity (SSE) attempt $attempt ────"
            if MIRROR_WS_TRANSPORT=0 bash docs/audits/playtest-harness/run_mirror_gate.sh; then
              echo "mirror-parity (SSE): PASS on attempt $attempt"
              exit 0
            fi
            echo "mirror-parity (SSE): attempt $attempt did not pass; retrying"
            sleep 3
          done
          echo "::error::mirror-parity gate failed all attempts (two windows diverged during streaming)"
          exit 1
      # ── WS Phase-1 turn-on gate — WebSocket transport (case f, protocol spec §6/§7) ──────────────
      # The SAME F5 invariant under the WebSocket transport (`ORWELL_WS_TRANSPORT` forced on via an init
      # script inside mirror_live_parity.mjs). This PROVES the socket path mirrors A→B live and closes the
      # WS false-green hole (the `wsTransportEngaged` check fails a run that silently fell back). Now
      # BLOCKING (turned on 2026-07-10): both turn-on readiness items landed — (1) the FE `requirements.txt` (and its pinned `requirements.lock.txt`, which CI installs)
      # pins `websockets==16.0` so uvicorn serves the upgrade in production; and (2) the client WS connect
      # (orwellWs.js) no longer races session establishment — it defers the hello until `perTabId` resolves
      # (#1353), so no null-`perTabId` `bad-request` / permanent fallback. `ORWELL_WS_TRANSPORT` is now
      # default-on (settings.py `ws_transport_enabled`); this leg keeps both modes honest (protocol spec §9
      # step 7 — WS default-on only with both legs green).
      - name: mirror-parity gate — WebSocket transport (blocking)
        if: matrix.group == 'live'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "──── mirror-parity (WS) attempt $attempt ────"
            if MIRROR_WS_TRANSPORT=1 bash docs/audits/playtest-harness/run_mirror_gate.sh; then
              echo "mirror-parity (WS): PASS on attempt $attempt"
              exit 0
            fi
            echo "mirror-parity (WS): attempt $attempt did not pass; retrying"
            sleep 3
          done
          echo "::error::mirror-parity WS-transport leg failed all attempts (two windows diverged during streaming under WS, or the socket silently fell back)."
          exit 1
      # ── tool-rich multi-round parity (H1/H2), BOTH transports (#1087) ─────────────────────────────
      # The single-round live gate above never exercises the agent-loop MULTI-ROUND path — which is
      # where the WS rebind→ring-replay churn regression lived (issue #1087: toolturn red on main
      # while both live legs stayed green, because the gate wasn't in CI). The toolturn gate also
      # asserts the WS frame-log collapse (one chat subscribe per attached run, no stale run-started
      # edge churn), so a reintroduced replay loop fails loudly here, not in production.
      - name: mirror-toolturn gate — SSE/poll transport (blocking)
        if: matrix.group == 'rest'
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            echo "──── mirror-toolturn (SSE) attempt $attempt ────"
            if MIRROR_TOOLTURN=1 MIRROR_WS_TRANSPORT=0 bash docs/audits/playtest-harness/run_mirror_gate.sh; then
              echo "mirror-toolturn (SSE): PASS on attempt $attempt"
              exit 0
            fi
            echo "mirror-toolturn (SSE): attempt $attempt did not pass; retrying"
            sleep 3
          done
          echo "::error::mirror-toolturn SSE leg failed all attempts (dup/orphan bubbles across a tool-rich turn under the fallback transport)."
          exit 1
      - name: mirror-toolturn gate — WebSocket transport (blocking)
        if: matrix.group == 'rest'
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            echo "──── mirror-toolturn (WS) attempt $attempt ────"
            if MIRROR_TOOLTURN=1 MIRROR_WS_TRANSPORT=1 bash docs/audits/playtest-harness/run_mirror_gate.sh; then
              echo "mirror-toolturn (WS): PASS on attempt $attempt"
              exit 0
            fi
            echo "mirror-toolturn (WS): attempt $attempt did not pass; retrying"
            sleep 3
          done
          echo "::error::mirror-toolturn WS leg failed all attempts (the #1087 rebind→ring-replay churn class: dup bubbles / subscribe churn on a tool-rich turn under WS)."
          exit 1
      # ── F5 HUD/status parity (0064 §B/D), BOTH transports (#1880) ──────────────────────────────
      # The executable, model-independent HUD-parity gate for F5's STATUS/GADGET half:
      # two windows on one started game; A sends a mutating turn (the 0055 _auto_record_scene belt
      # commits an engine mutation via a long player line); B must reconcile its HUD off the SERVER
      # PUSH (the 0064 `game-updated` SSE or the ws:state bridge) within the budget, not on its own
      # 20-30s poll. Key-free, deterministic fake model, same run_mirror_gate.sh driver as the live
      # and toolturn parity gates. See docs/audits/playtest-harness/README.md §10.
      - name: mirror-hud gate — SSE/poll transport (blocking)
        if: matrix.group == 'rest'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "──── mirror-hud (SSE) attempt $attempt ────"
            if MIRROR_HUD=1 MIRROR_WS_TRANSPORT=0 bash docs/audits/playtest-harness/run_mirror_gate.sh; then
              echo "mirror-hud (SSE): PASS on attempt $attempt"
              exit 0
            fi
            echo "mirror-hud (SSE): attempt $attempt did not pass; retrying"
            sleep 3
          done
          echo "::error::mirror-hud SSE leg failed all attempts (B's HUD did not reconcile off the SSE push within budget)."
          exit 1
      - name: mirror-hud gate — WebSocket transport (blocking)
        if: matrix.group == 'rest'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "──── mirror-hud (WS) attempt $attempt ────"
            if MIRROR_HUD=1 MIRROR_WS_TRANSPORT=1 bash docs/audits/playtest-harness/run_mirror_gate.sh; then
              echo "mirror-hud (WS): PASS on attempt $attempt"
              exit 0
            fi
            echo "mirror-hud (WS): attempt $attempt did not pass; retrying"
            sleep 3
          done
          echo "::error::mirror-hud WS leg failed all attempts (B's HUD did not reconcile off the ws:state push within budget under WS transport)."
          exit 1

  # ── #1375 rendered a11y gate — axe-core + WCAG/APCA contrast over the staged matrix ──────────
  #
  # The sibling of fe-responsive (gap 3 of #651): boots the SAME engine-staged responsive matrix
  # (ORWELL_MATRIX_ENGINE + ORWELL_MATRIX_FINISH=1 — chrome + game + endgame surfaces) but runs
  # scripts/a11y_matrix.py, which injects the VENDORED axe-core (frontend/tests/vendor/axe.min.js —
  # no CDN, no network) into each rendered surface and runs a rendered WCAG(4.5:1/3:1)+APCA contrast
  # sweep that samples the true backdrop pixels behind text (glass/scrim/blur the source-pinned
  # checks can't see). KNOWN violations are XFAIL'd (ratchet); an UNKNOWN one FAILS. PATH-GATED on
  # `changes.frontend` (same as fe-responsive). NON-BLOCKING while it bakes (owner ruling): it still
  # RUNS + reports its own status on FE PRs, but is deliberately NOT in `ci-gate`'s `needs`/results,
  # so it never gates a merge. Fold it into ci-gate to flip it blocking once the ratchet is trusted.
  a11y-matrix:
    needs: changes
    if: needs.changes.outputs.fe_render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install front-end deps
        run: pip install -r frontend/requirements.lock.txt
      - uses: ./.github/actions/setup-playwright
      # Stage a REAL engine (deterministic Echo narrator, key-free — same as fe-responsive) so the
      # game + endgame surfaces are actually rendered + audited.
      - name: build the engine (dist/main.js the matrix stages against)
        run: |
          npm ci
          npm run build
      - name: boot the engine
        run: |
          ORWELL_ENGINE_PORT=8765 ORWELL_DATA_DIR="$RUNNER_TEMP/orwell-a11y-data" \
            node dist/main.js > "$RUNNER_TEMP/orwell-a11y-engine.log" 2>&1 &
          for i in $(seq 60); do
            if curl -fsS http://127.0.0.1:8765/health > /dev/null 2>&1; then
              echo "engine healthy"; exit 0
            fi
            sleep 1
          done
          echo "::error::engine did not become healthy"
          cat "$RUNNER_TEMP/orwell-a11y-engine.log"
          exit 1
      - name: a11y matrix gate — axe + WCAG/APCA contrast, ENGINE-STAGED (#1375, gap 3 of #651)
        env:
          ORWELL_MATRIX_ENGINE: http://127.0.0.1:8765
          ORWELL_MATRIX_FINISH: "1"
        run: cd frontend && python3 scripts/a11y_matrix.py
      - name: engine log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/orwell-a11y-engine.log" || true

  # ── Unified required-check gate (deadlock-free on skip) ──────────────────────────
  #
  # THE single required check — point branch protection HERE, not at the individual gated jobs. It
  # ALWAYS runs (`if: always()`), so its conclusion always resolves even when every upstream job was
  # path-skipped. It passes when no needed job FAILED or was CANCELLED — a `skipped` (path-filtered) or
  # `success` result both count as a pass — and fails otherwise.
  #
  # Why this is genuinely deadlock-free on an all-skip (e.g. a docs-only PR): the gated jobs report
  # `skipped`; `ci-gate` still runs (always()); each `needs.*.result` is `skipped`; the loop below
  # treats `skipped`/`success` as OK and exits 0. No required check is ever left "expected / pending".
  ci-gate:
    timeout-minutes: 5
    needs:
      - changes
      - test
      - test-unit
      - coverage-shard
      - coverage
      - smoke
      - fe-unit
      - fe-browser-tests
      - fe-browser
      - fe-responsive
      - mirror-parity
      - heavy-sims
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: resolve overall CI status
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            test=${{ needs.test.result }}
            test-unit=${{ needs.test-unit.result }}
            coverage-shard=${{ needs.coverage-shard.result }}
            coverage=${{ needs.coverage.result }}
            smoke=${{ needs.smoke.result }}
            fe-unit=${{ needs.fe-unit.result }}
            fe-browser-tests=${{ needs.fe-browser-tests.result }}
            fe-browser=${{ needs.fe-browser.result }}
            fe-responsive=${{ needs.fe-responsive.result }}
            mirror-parity=${{ needs.mirror-parity.result }}
            heavy-sims=${{ needs.heavy-sims.result }}
        run: |
          set -euo pipefail
          echo "Needed job results: $RESULTS"
          fail=0
          for kv in $RESULTS; do
            name="${kv%%=*}"
            result="${kv#*=}"
            # A required job is OK iff it succeeded or was skipped (path-filtered). Anything else
            # (failure / cancelled / — an unexpected empty result) fails the gate.
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "::error::needed job '$name' did not pass (result: '$result')"
                fail=1
                ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "ci-gate: FAIL"
            exit 1
          fi
          echo "ci-gate: PASS (all needed jobs succeeded or were skipped)"
