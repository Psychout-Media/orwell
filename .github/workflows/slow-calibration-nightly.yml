name: slow-calibration-nightly

# ORW-986 (follow-up of ORW-982 and ORW-944; Coordinator 2026-11-26): the calibration reads that are too slow for a PR, run nightly and on demand.
#   1. The calibration GRADIENT gate at 60 seeds (ORW-982: 6 seeds tripped on noise; out of the PR workflow since #2361). Four shard legs play
#      15 seeds each (passive + active seasons), an aggregate leg asserts the band over all 60.
#   2. The WHOLE-SEASON MIX over 12 seasons (ORW-944's blind spot: with the PR guard's 4 seasons the late gossip and strategy rules swing about
#      +-11 points, so a smaller late change is invisible there). The four finishing seeds each play under 3 sandbox names (WSMIX_REPLICAS=3).
# NOT a required check, never on pull_request. Every leg's timeout is set so its measured run stays at or under 75% of it.
# On a failing night it opens or updates ONE tracking issue (label `slow-calibration-nightly`), never a new one per night.
on:
  schedule:
    - cron: "37 10 * * *" # 10:37 UTC, the small hours in the US; off the hour
  workflow_dispatch:

permissions:
  contents: read

# A scheduled and a manual run never both see "no open issue" and each open one.
concurrency:
  group: slow-calibration-nightly
  cancel-in-progress: false

jobs:
  gradient-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # measured: 60 seeds in one process take ~16 min on a runner, so a 15-seed shard takes ~4-8; 30 keeps it well under 75%
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: gradient shard ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: play this shard's seeds (no band assertion here)
        env:
          GRADIENT_SHARDS: "4"
          GRADIENT_SHARD: ${{ matrix.shard }}
          GRADIENT_RESULTS_DIR: gradient-shards
        run: npx vitest run tests/property/calibrationGradient.property.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradient-shard-${{ matrix.shard }}
          path: gradient-shards/
          if-no-files-found: error

  gradient:
    needs: gradient-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # reads four small files and asserts: under a minute
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: gradient-shard-*
          path: gradient-shards
          merge-multiple: true
      - name: the gradient band over all 60 seeds
        env:
          GRADIENT_RESULTS_DIR: gradient-shards
        run: |
          set -o pipefail
          npx vitest run tests/property/calibrationGradientAggregate.property.test.ts 2>&1 | tee gradient.log
      - name: summary
        if: always()
        run: |
          node -e '
            const fs = require("fs"), dir = "gradient-shards";
            const rows = (fs.existsSync(dir) ? fs.readdirSync(dir) : []).filter((n) => n.endsWith(".json")).flatMap((n) => JSON.parse(fs.readFileSync(dir + "/" + n, "utf8")).results);
            const reach = (k) => rows.filter((r) => r[k].status !== "evicted").length, wins = (k) => rows.filter((r) => r[k].won).length;
            const md = `### Calibration gradient (${rows.length} seeds)\n\n| | jury reach | wins |\n|---|---|---|\n| passive | ${reach("passive")}/${rows.length} | ${wins("passive")} |\n| active | ${reach("active")}/${rows.length} | ${wins("active")} |\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradient-log
          path: gradient.log
          if-no-files-found: ignore

  season-mix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # 4 seasons take ~7 min on a runner of this size; 12 sharing its cores ~25-40; 60 keeps it under 75%
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: the whole-season mix over 12 seasons (4 seeds x 3 sandbox names), judged
        env:
          WSMIX_REPLICAS: "3"
        run: |
          set -o pipefail
          npx vitest run tests/uat/wholeSeasonMixGuard.test.ts 2>&1 | tee mix.log
      - name: summary
        if: always()
        run: |
          {
            echo "### Whole-season mix (12 seasons)"
            echo
            echo '```'
            grep -E "MIXWS judged|MIXWS rule FAIL" mix.log | sed -E 's/\x1b\[[0-9;]*m//g' || echo "no MIXWS lines (the run did not get to judging)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mix-log
          path: mix.log
          if-no-files-found: ignore

  report:
    needs: [gradient, season-mix]
    if: always() && github.event_name == 'schedule' && (needs.gradient.result != 'success' || needs.season-mix.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open or update the ONE tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GRADIENT: ${{ needs.gradient.result }}
          MIX: ${{ needs.season-mix.result }}
        run: |
          set -euo pipefail
          label=slow-calibration-nightly
          gh label create "$label" --color D93F0B --description "Nightly slow calibration (gradient 60 seeds, whole-season mix 12 seasons) failed" 2>/dev/null || true
          body="The nightly slow calibration failed: $RUN_URL (gradient: $GRADIENT, whole-season mix: $MIX). The job summary has the numbers."
          n=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Nightly slow calibration failed" --label "$label" --body "$body"; fi
